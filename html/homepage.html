<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Praha</title>
    <link href='https://fonts.googleapis.com/css?family=Calistoga' rel='stylesheet'>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav>

    </nav>

    <header id="home_header">
        <div>P</div>
        <div>R</div>
        <div>A</div>
        <div>H</div>
        <div>A</div>
    </header>

    <section id="places">
        <h1>Oh the places I went!</h1>
        <div id="places_cards">
            <div class="sign_card">
                <p>Favorites</p>
            </div>
            <div class="sign_card">
                <p>Activities</p>
            </div>
            <div class="sign_card">
                <p>Travels</p>
            </div>
        </div>
    </section>

    <section id="activities">
        <h1>Activities</h1>
        <div id="activities_cards">
            <div class="activity_card">
                <img src="/img/glass_blowing.jpg" class="activity_photo" alt="Glass Blowing">
            </div>
            <div class="activity_card">
                <img src="../img/goKart.jpg" class="activity_photo" alt="Go Kart track"/>
            </div>
        </div>
        <button id="more_adventures" class="more_btn">More Adventures</button>
    </section>

    <section id="travels">
        <h1>My Travels</h1>
        <div id="travel_imgs">
            <div class="travel_card">
                <img src="../img/rome_cover.jpg" class="travel_img" alt="Rome cover"/>
                Rome, Italy
            </div>
            <div class="travel_card">
                <img src="../img/budapest_cover.jpg" class="travel_img" alt="Budapest cover"/>
                Budapest, Hungary
            </div>
            <div class="travel_card">
                <img src="../img/dresden_cover.jpg" class="travel_img" alt="Dresden cover"/>
                Dresden, Germany
            </div>
        </div>
        <button id="more_travel" class="more_btn">More Travels</button>

    </section>

    <section id="quiz">
        <h1>What Prague building are you?</h1>
        <div id="quiz_imgs">
            <div class="quiz_img">
                quiz img
            </div>
            <div class="quiz_img">
                quiz_img
            </div>
            <div class="quiz_img">
                quiz_img
            </div>
            <div class="quiz_img">
                quiz_img
            </div>
            <div class="quiz_img">
                quiz_img
            </div>
        </div>
        <button class="more_btn quiz_btn"  onclick="window.location.href='../html/quiz.html'">Take the Quiz!</button>
    </section>

    <footer>

    </footer>

</body>
</html>
